<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webduino</title>
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <header>
        <div id="logo-container">
            <!-- <img id="logo" src="assets/images/w98_computer_2.ico" alt=""> -->
            <img id="logo" src="assets/images/w2k_ramdrive.ico" alt="">
            <h3>Webduino</h3>
        </div>
    </header>
    <main>
        <section id="search_area" class="card">
            <div>
                <p>
                    Clique no botão abaixo para procurar o caminho da placa:
                </p>
                <button type="button" id="search_btn" name="search_btn">Procurar!</button>
                <p>
                    <b>Placa: <span id="placa"></span></b>
                </p>

            </div>
            <div>
                <img style="width: 14rem;" src="assets/images/arduino.png" alt="">
            </div>
        </section>
        <hr />
        <section class="card" id="command_panel">
            <p>Os botões abaixo servem para deixar a placa em standby ou iniciar o envio e recepção de dados.</p>
            <p>Serve para confirmar se o servidor está se comunicando corretamente com a placa.</p>
            <button style="background-color: #c3de6a;" type="button" id="standby" name="standby">Stand By</button>
            <button style="background-color: #70db80;" type="button" id="ativar" name="ativar">Ativar!</button>
            <p><b>Estado: <span id="estado"></span></b></p>
        </section>

    </main>
    <script src="assets/script.js"></script>
</body>

</html>
